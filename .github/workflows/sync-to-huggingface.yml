name: Sync to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Sync current files to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir /tmp/hf-space
          git archive HEAD | tar -x -C /tmp/hf-space

          cd /tmp/hf-space
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Sync from GitHub"

          git remote add huggingface https://user:$HF_TOKEN@huggingface.co/spaces/Prabodini/Test01
          git push --force huggingface HEAD:main
